[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtbox"
version = "0.6.3"
description = "Lightweight M-Team subscription downloader for NAS"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "mtbox contributors" }]
requires-python = ">=3.11"
keywords = ["m-team", "qbit", "nas", "subscription", "torrent", "fastapi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "apscheduler>=3.10,<4",
  "pydantic-settings>=2.2",
  "itsdangerous>=2.1",
  "zhconv>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mtbox = "app.cli:main"

[project.urls]
# TODO(owner): 发布前把 OWNER 替换为实际 GitHub 账号/组织（见 docs/development/release.md）。
Homepage = "https://github.com/OWNER/mtbox"
Repository = "https://github.com/OWNER/mtbox"
Issues = "https://github.com/OWNER/mtbox/issues"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
