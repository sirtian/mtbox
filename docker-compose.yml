services:
  mtbox:
    build: .
    image: mtbox:0.6.3
    container_name: mtbox
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      DOWNLOAD_DIR: /downloads
      LIBRARY_DIR: /media
      DATA_DIR: /config
      PORT: ${PORT:-8080}
    ports:
      - "${MTBOX_PORT:-8080}:${PORT:-8080}"
    volumes:
      # 宿主机路径请按极空间实际目录修改；/downloads 必须与 qBittorrent 容器映射到同一目录
      - ${MTBOX_CONFIG_PATH:-./config}:/config
      - ${MTBOX_DOWNLOADS_PATH:-./downloads}:/downloads
      - ${MTBOX_LIBRARY_PATH:-./media}:/media
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, urllib.request; p=os.environ.get('PORT', '8080'); sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:' + p + '/health', timeout=5).status == 200 else 1)"]
      interval: 60s
      timeout: 8s
      retries: 3
      start_period: 30s
